<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow INVIA | INVIA Apparel</title>
<link rel="stylesheet" href="invia-legal.css">
<style>
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.social-card{
  display:block;
  text-decoration:none;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  padding:28px;
  transition:.2s ease;
}
.social-card:hover{transform:translateY(-2px);border-color:#666}
.social-name{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}
.social-handle{color:var(--muted);margin:0}
@media(max-width:700px){.social-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="site-shell">
<header>
  <a class="brand" href="index.html">INVIA</a>
  <nav>
    <a href="collections.html">Collections</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <div class="eyebrow">Stay Connected</div>
  <h1>Follow INVIA</h1>
  <p class="muted">New drops, previews, edits, and release updates.</p>

  <div class="social-grid">
    <a class="social-card" href="https://www.instagram.com/invia_apparel/" target="_blank" rel="noopener noreferrer">
      <p class="social-name">Instagram →</p>
      <p class="social-handle">@invia_apparel</p>
    </a>

    <a class="social-card" href="https://www.tiktok.com/@invia_apparel" target="_blank" rel="noopener noreferrer">
      <p class="social-name">TikTok →</p>
      <p class="social-handle">@invia_apparel</p>
    </a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div>© INVIA Apparel</div>
    <div class="footer-links">
      <a href="shipping.html">Shipping</a>
      <a href="returns.html">Returns & Exchanges</a>
      <a href="size-chart.html">Size Chart</a>
      <a href="contact.html">Contact</a>
      <a href="socials.html">Instagram / TikTok</a>
    </div>
  </div>
</footer>
</div>
</body>
</html>
